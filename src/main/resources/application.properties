spring.application.name=butex

# Use Neon + Redis credentials from application-local.properties when running locally (IDE or mvnw)
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set REDIS_URL on Render (Butex web service env). Local profile overrides in application-local.properties.
spring.data.redis.url=${REDIS_URL}

spring.cache.type=redis
spring.cache.redis.time-to-live=10s
